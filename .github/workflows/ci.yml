name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[test]" ruff
      - run: ruff check app tests
      - run: pytest
      - run: python -m py_compile ../../scripts/tokenpress.py
      - name: Check migrations on fresh SQLite
        env:
          DATABASE_URL: sqlite+aiosqlite:///./.tmp/ci-migrations.db
        run: |
          mkdir -p .tmp
          alembic -c alembic.ini upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
