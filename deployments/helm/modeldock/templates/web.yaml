apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modeldock.fullname" . }}-web
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}"
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: MODELDOCK_API_URL
              value: "http://{{ include "modeldock.fullname" . }}-api:{{ .Values.api.service.port }}"
            - name: MODELDOCK_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "modeldock.secretName" . }}
                  key: {{ .Values.external.adminApiKey | quote }}
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 10