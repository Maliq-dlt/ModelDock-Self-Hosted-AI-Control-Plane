apiVersion: v1
kind: Service
metadata:
  name: {{ include "modeldock.fullname" . }}-api
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "modeldock.fullname" . }}-web
  labels:
    {{- include "modeldock.labels" . | nindent 4 }}
spec:
  type: {{ .Values.web.service.type }}
  selector:
    app.kubernetes.io/component: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: 3000