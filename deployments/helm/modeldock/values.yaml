nameOverride: ""
fullnameOverride: ""

image:
  api:
    repository: modeldock-api
    tag: "0.2.0"
    pullPolicy: IfNotPresent
  web:
    repository: modeldock-web
    tag: "0.2.0"
    pullPolicy: IfNotPresent

api:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }

web:
  replicas: 2
  service:
    type: ClusterIP
    port: 3000

worker:
  replicas: 1
  intervalSeconds: 2

config:
  appEnv: production
  corsOrigins: http://modeldock-web:3000
  requestRetentionDays: "30"
  circuitBreakerFailureThreshold: "3"
  circuitBreakerCooldownSeconds: "60"

secrets:
  create: false
  existingSecret: modeldock-secrets
  data: {}

external:
  databaseUrlKey: DATABASE_URL
  redisUrlKey: REDIS_URL
  adminApiKey: ADMIN_API_KEY
  adminSessionSecret: ADMIN_SESSION_SECRET
  apiKeyHashSecret: API_KEY_HASH_SECRET
  credentialEncryptionKey: CREDENTIAL_ENCRYPTION_KEY

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  cpuUtilization: 70

pdb:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true