apiVersion: v1
kind: Namespace
metadata:
  name: modeldock
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: modeldock-config
  namespace: modeldock
data:
  APP_ENV: production
  REDIS_URL: redis://redis:6379/0
  CORS_ORIGINS: http://modeldock-web
  REQUEST_RETENTION_DAYS: "30"
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "3"
  CIRCUIT_BREAKER_COOLDOWN_SECONDS: "60"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: modeldock
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: modeldock
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports: [{ containerPort: 5432 }]
          env:
            - { name: POSTGRES_DB, value: modeldock }
            - { name: POSTGRES_USER, value: modeldock }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: modeldock-secrets, key: POSTGRES_PASSWORD } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U modeldock -d modeldock"] }, initialDelaySeconds: 5, periodSeconds: 5 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-data } }]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: modeldock
spec:
  selector: { app: postgres }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: modeldock
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          readinessProbe: { exec: { command: ["redis-cli", "ping"] }, initialDelaySeconds: 3, periodSeconds: 5 }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: modeldock
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeldock-api
  namespace: modeldock
spec:
  replicas: 2
  selector:
    matchLabels: { app: modeldock-api }
  template:
    metadata:
      labels: { app: modeldock-api }
    spec:
      containers:
        - name: api
          image: modeldock-api:0.2.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: modeldock-config }
            - secretRef: { name: modeldock-secrets }
          readinessProbe: { httpGet: { path: /ready, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 15, periodSeconds: 15 }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: modeldock-api
  namespace: modeldock
spec:
  selector: { app: modeldock-api }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeldock-worker
  namespace: modeldock
spec:
  replicas: 1
  selector:
    matchLabels: { app: modeldock-worker }
  template:
    metadata:
      labels: { app: modeldock-worker }
    spec:
      containers:
        - name: worker
          image: modeldock-api:0.2.0
          imagePullPolicy: IfNotPresent
          command: ["python", "scripts/evaluation_worker.py", "--interval", "2"]
          envFrom:
            - configMapRef: { name: modeldock-config }
            - secretRef: { name: modeldock-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: modeldock-web
  namespace: modeldock
spec:
  replicas: 2
  selector:
    matchLabels: { app: modeldock-web }
  template:
    metadata:
      labels: { app: modeldock-web }
    spec:
      containers:
        - name: web
          image: modeldock-web:0.2.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: MODELDOCK_API_URL, value: http://modeldock-api:8080 }
            - name: MODELDOCK_ADMIN_API_KEY
              valueFrom: { secretKeyRef: { name: modeldock-secrets, key: ADMIN_API_KEY } }
          readinessProbe: { httpGet: { path: /, port: 3000 }, initialDelaySeconds: 10, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: modeldock-web
  namespace: modeldock
spec:
  selector: { app: modeldock-web }
  ports: [{ port: 3000, targetPort: 3000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: modeldock-api
  namespace: modeldock
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: modeldock-api }
  minReplicas: 2
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: modeldock-api
  namespace: modeldock
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: modeldock-api }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: modeldock-default
  namespace: modeldock
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
